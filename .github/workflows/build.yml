name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TVGuide.apk

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVGuide-apk
          path: TVGuide.apk

      - name: Publish a release (easy download link for the Fire Stick)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV Guide build ${{ github.run_number }}
          files: TVGuide.apk
          make_latest: true
